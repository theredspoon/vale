# Negated tokens at sentence boundaries, plus region `exceptions`.
#
# A negated token asserts the absence of something, so the sentence boundary
# satisfies it: "not preceded by X" holds when nothing precedes the match at
# all. An exception marks a region of the sentence, and a match that begins
# inside one is dropped.
StylesPath = styles

MinAlertLevel = suggestion

[*.md]
BasedOnStyles = T
